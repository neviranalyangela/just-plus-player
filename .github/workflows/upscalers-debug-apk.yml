name: Debug APK (upscalers)

on:
  workflow_dispatch:
  push:
    branches: [feat/upscalers]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          # Single-JVM (--no-daemon) build of a huge app: default heap OOMs in zipflinger while packaging.
          GRADLE_OPTS: "-Xmx8g -XX:MaxMetaspaceSize=1g"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-upscalers
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
